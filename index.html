<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Four Frame Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a booth panel — viewfinder + controls on one side, the printed strip on the other; stacks on phones. Deliberately single-theme (dark booth). */
:root {
  --booth: #1f1a24;
  --panel: #2b2432;
  --line: #43394b;
  --ink: #f2ece4;
  --muted: #b3a8b8;
  --brass: #e3a94b;
  --paper: #f7f3ec;
  --paper-ink: #2a2230;
  --f-sign: "Shrikhand", "Georgia", serif;
  --f-body: "Work Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--booth); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-sign); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1; margin: 0; color: var(--brass); letter-spacing: .5px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
.booth { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 16px; min-width: 0; }
.finder { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #110e14; border-radius: 8px; overflow: hidden; display: grid; place-items: center; }
.finder video, .finder canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.finder video { transform: scaleX(-1) scale(var(--zoom, 1.4)); }
.finder video { transition: transform .25s ease; }
.hintbox { display: grid; gap: 14px; justify-items: center; max-width: 34ch; }
.hintbox p { margin: 0; }
.hintbox .btn { flex: none; }
.finder .hint { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-sign); font-size: 120px; color: var(--ink); text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .45s ease-out; }
@keyframes flash { from { opacity: .95 } to { opacity: 0 } }
.shotno { position: absolute; top: 10px; left: 10px; font: 500 12px var(--f-mono); letter-spacing: 1px; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 4px; }
.label { font: 500 11px var(--f-mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 500 14px var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--booth); border-color: var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 600 15px var(--f-body); border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: #241a10; flex: 1 1 200px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
input[type=text] { width: 100%; font: 15px var(--f-body); color: var(--ink); background: #1a1520; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.status { min-height: 1.5em; font-size: 13px; color: var(--muted); margin: 0; }
.stripcol { display: grid; gap: 12px; justify-items: center; }
#strip { width: 100%; max-width: 240px; height: auto; box-shadow: 0 18px 40px rgba(0,0,0,.45); transform: rotate(-1.5deg); border-radius: 2px; }
.slot { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: 1px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } #strip { transform: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Four Frame Booth</h1>
    <p class="sub">Four shots, one strip. Pick a look, smile, save.</p>
  </header>

  <section class="booth" aria-label="Camera">
    <div class="finder" id="finder">
      <video id="video" playsinline muted hidden></video>
      <canvas id="preview" width="800" height="600" hidden></canvas>
      <div class="hint" id="hint">
        <div class="hintbox">
          <p id="hinttext">Turn on the camera to see yourself before the countdown.</p>
          <button class="btn primary" id="camon">Turn on camera</button>
        </div>
      </div>
      <div class="count" id="count" hidden></div>
      <div class="flash" id="flash"></div>
      <div class="shotno" id="shotno">SHOT 1 / 4</div>
    </div>

    <div>
      <p class="label">Look</p>
      <div class="filters" id="filters" role="group" aria-label="Filter">
        <button class="chip" data-f="none" aria-pressed="true">Natural</button>
        <button class="chip" data-f="bw" aria-pressed="false">Silver B&amp;W</button>
        <button class="chip" data-f="sepia" aria-pressed="false">Sepia</button>
        <button class="chip" data-f="faded" aria-pressed="false">Faded film</button>
        <button class="chip" data-f="punch" aria-pressed="false">Punch</button>
      </div>
    </div>

    <div>
      <p class="label">Camera</p>
      <div class="filters" id="lens" role="group" aria-label="Camera">
        <button class="chip" data-z="1.5" aria-pressed="true">Normal</button>
        <button class="chip" data-z="1" aria-pressed="false">Wide angle</button>
      </div>
    </div>

    <div>
      <label class="label" for="caption">Caption on the strip</label>
      <input type="text" id="caption" maxlength="28" value="Helia's photobooth">
    </div>

    <div class="row">
      <button class="btn primary" id="shoot">Take photo</button>
      <button class="btn" id="retake">Start over</button>
    </div>
    <input type="file" id="file" accept="image/*" capture="user" hidden>
    <p class="status" id="status" role="status"></p>
  </section>

  <aside class="stripcol" aria-label="Your strip">
    <canvas id="strip" width="640" height="2040"></canvas>
    <p class="slot" id="slot">SAMPLE STRIP · 0 OF 4 TAKEN</p>
    <button class="btn" id="save" disabled>Save strip (PNG)</button>
  </aside>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $("video"), preview = $("preview"), hint = $("hint"), count = $("count"),
        flash = $("flash"), shotno = $("shotno"), shootBtn = $("shoot"), retakeBtn = $("retake"),
        file = $("file"), status = $("status"), strip = $("strip"), slot = $("slot"),
        saveBtn = $("save"), caption = $("caption");

  const PW = 800, PH = 600;      // shot size (4:3)
  let filter = "none";   // every visit starts on Natural
  let shots = [];                // raw (unfiltered) canvases
  let stream = null, busy = false;

  /* ---------- filters ----------
     Each look is a list of CSS filter steps. The live camera preview uses them
     as a CSS `filter`; photos get the same steps done pixel by pixel (same
     math as the CSS spec), so what you see live is what ends up on the strip. */
  const LOOKS = {
    none:  [],
    bw:    [["grayscale", 1], ["contrast", 1.25]],
    sepia: [["sepia", 0.9], ["contrast", 1.05], ["brightness", 1.05]],
    faded: [["contrast", 0.8], ["brightness", 1.08], ["saturate", 0.8], ["sepia", 0.15]],
    punch: [["saturate", 1.45], ["contrast", 1.1]],
  };
  const cssFilter = f => LOOKS[f].map(([op, v]) => `${op}(${v})`).join(" ") || "none";

  // 3x3 colour matrices from the CSS Filter Effects spec
  function matrix(op, a) {
    const k = 1 - a;
    if (op === "grayscale") return [.2126+.7874*k, .7152-.7152*k, .0722-.0722*k, .2126-.2126*k, .7152+.2848*k, .0722-.0722*k, .2126-.2126*k, .7152-.7152*k, .0722+.9278*k];
    if (op === "sepia") return [.393+.607*k, .769-.769*k, .189-.189*k, .349-.349*k, .686+.314*k, .168-.168*k, .272-.272*k, .534-.534*k, .131+.869*k];
    if (op === "saturate") return [.213+.787*a, .715-.715*a, .072-.072*a, .213-.213*a, .715+.285*a, .072-.072*a, .213-.213*a, .715-.715*a, .072+.928*a];
    return null;
  }
  const clamp = v => v < 0 ? 0 : v > 255 ? 255 : v;

  function applyFilter(src, f) {
    const c = document.createElement("canvas"); c.width = PW; c.height = PH;
    const x = c.getContext("2d"); x.drawImage(src, 0, 0);
    const steps = LOOKS[f];
    if (!steps.length) return c;
    const prepared = steps.map(([op, v]) => [op, v, matrix(op, v)]);
    const img = x.getImageData(0, 0, PW, PH), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];
      for (const [op, v, m] of prepared) {
        if (m) { const R = m[0]*r + m[1]*g + m[2]*b, G = m[3]*r + m[4]*g + m[5]*b, B = m[6]*r + m[7]*g + m[8]*b; r = R; g = G; b = B; }
        else if (op === "contrast") { r = (r - 127.5) * v + 127.5; g = (g - 127.5) * v + 127.5; b = (b - 127.5) * v + 127.5; }
        else if (op === "brightness") { r *= v; g *= v; b *= v; }
        r = clamp(r); g = clamp(g); b = clamp(b);
      }
      d[i] = r; d[i+1] = g; d[i+2] = b;
    }
    x.putImageData(img, 0, 0);
    return c;
  }

  /* ---------- crop any source to 4:3, optionally mirrored ---------- */
  function capture(src, sw, sh, mirror, z = 1) {
    const c = document.createElement("canvas"); c.width = PW; c.height = PH;
    const x = c.getContext("2d");
    const target = PW / PH; let cw = sw, ch = sh;
    if (sw / sh > target) cw = sh * target; else ch = sw / target;
    cw /= z; ch /= z;   // digital zoom: keep only the centre, same as the preview
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
    if (mirror) { x.translate(PW, 0); x.scale(-1, 1); }
    x.drawImage(src, sx, sy, cw, ch, 0, 0, PW, PH);
    return c;
  }

  /* ---------- sample frames so the strip isn't empty at rest ---------- */
  function sampleShot(i) {
    const c = document.createElement("canvas"); c.width = PW; c.height = PH;
    const x = c.getContext("2d");
    const hues = [28, 330, 200, 140];
    const g = x.createLinearGradient(0, 0, PW, PH);
    g.addColorStop(0, `hsl(${hues[i]} 45% 62%)`); g.addColorStop(1, `hsl(${hues[i]+40} 40% 30%)`);
    x.fillStyle = g; x.fillRect(0, 0, PW, PH);
    // a simple silhouette: head + shoulders, shifted each frame like a pose
    x.fillStyle = "rgba(20,15,25,.55)";
    const cx = PW/2 + [-60, 40, 0, 80][i], tilt = [-.12, .1, 0, -.05][i];
    x.save(); x.translate(cx, PH*0.52); x.rotate(tilt);
    x.beginPath(); x.ellipse(0, -40, 95, 115, 0, 0, Math.PI*2); x.fill();
    x.beginPath(); x.ellipse(0, 260, 230, 170, 0, Math.PI, 0); x.fill();
    x.restore();
    x.fillStyle = "rgba(255,255,255,.85)"; x.font = "500 34px 'IBM Plex Mono', monospace";
    x.fillText("SAMPLE", 28, 56);
    return c;
  }

  /* ---------- compose the strip ---------- */
  const SW = 640, M = 40, G = 24, IW = SW - 2*M, IH = IW * 3/4, FOOT = 170;
  strip.height = M + 4*IH + 3*G + FOOT;
  function drawStrip() {
    const x = strip.getContext("2d");
    x.fillStyle = "#f7f3ec"; x.fillRect(0, 0, SW, strip.height);
    for (let i = 0; i < 4; i++) {
      const y = M + i*(IH + G);
      const src = shots[i] || (shots.length === 0 ? sampleShot(i) : null);
      if (src) x.drawImage(applyFilter(src, filter), M, y, IW, IH);
      else {
        x.fillStyle = "#e7e0d6"; x.fillRect(M, y, IW, IH);
        x.fillStyle = "#a99fa0"; x.font = "500 28px 'IBM Plex Mono', monospace";
        x.textAlign = "center"; x.fillText(String(i+1), SW/2, y + IH/2 + 10); x.textAlign = "left";
      }
    }
    const fy = M + 4*IH + 3*G;
    x.fillStyle = "#2a2230"; x.textAlign = "center";
    x.font = "52px Shrikhand, Georgia, serif";
    x.fillText(caption.value.trim() || "Four Frame Booth", SW/2, fy + 78, SW - 2*M);
    x.font = "500 22px 'IBM Plex Mono', monospace"; x.fillStyle = "#6f6470";
    const d = new Date();
    x.fillText(d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }).replace(/\//g, " · "), SW/2, fy + 124);
    x.textAlign = "left";
    slot.textContent = shots.length === 0 ? "SAMPLE STRIP · 0 OF 4 TAKEN" : `${shots.length} OF 4 TAKEN`;
    saveBtn.disabled = shots.length < 4;
  }

  function showPreview(src) {
    const pc = preview.getContext("2d");
    pc.drawImage(applyFilter(src, filter), 0, 0, PW, PH);
    preview.hidden = false; video.hidden = true; hint.hidden = true;
  }

  function updateButtons() {
    const n = shots.length;
    shotno.textContent = n >= 4 ? "STRIP DONE" : `SHOT ${n+1} / 4`;
    shootBtn.textContent = n >= 4 ? "Strip complete" : busy ? "Smile!" : liveFailed ? `Take photo ${n+1} of 4` : n === 0 ? "Take photo (4 in a row)" : "Continue the strip";
    shootBtn.disabled = n >= 4 || busy;
  }

  function addShot(c) {
    shots.push(c);
    flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
    showPreview(c); drawStrip(); updateButtons();
    status.textContent = shots.length >= 4 ? "Strip ready. Save it, or start over." : "";
  }

  /* ---------- live camera (when the browser allows it) ---------- */
  async function tryLive() {
    if (!navigator.mediaDevices?.getUserMedia) return false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
      video.srcObject = stream; await video.play();
      video.hidden = false; preview.hidden = true; hint.hidden = true;
      return true;
    } catch { stream = null; return false; }
  }
  const FIRST_COUNT = 4;   // seconds before the first photo
  const NEXT_COUNT = 3;    // seconds before each following photo
  const REVIEW_MS = 1200;  // how long each photo stays on screen after it's taken
  let cancelled = false;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function runSequence() {
    busy = true; cancelled = false; updateButtons();
    let first = true;
    while (shots.length < 4 && !cancelled) {
      video.hidden = false; preview.hidden = true;
      for (let n = first ? FIRST_COUNT : NEXT_COUNT; n > 0 && !cancelled; n--) {
        count.textContent = n; count.hidden = false; await wait(1000);
      }
      count.hidden = true;
      if (cancelled) break;
      addShot(capture(video, video.videoWidth, video.videoHeight, true, zoom));
      first = false;
      if (shots.length < 4) { status.textContent = "Next photo coming…"; await wait(REVIEW_MS); }
    }
    count.hidden = true; busy = false; updateButtons();
  }

  /* ---------- camera start-up: live preview before any photo ---------- */
  // The page asks for the camera as soon as it opens, so you can see yourself
  // and pick Normal or Wide angle before the countdown. If the browser needs
  // a tap first, the "Turn on camera" button does it.
  // If the live camera is refused, Take photo opens the camera app instead
  // (that branch must stay synchronous: phones only open the camera picker
  // when file.click() runs directly inside the tap).
  const camBtn = $("camon"), hintText = $("hinttext");
  let liveFailed = false;
  async function startCamera(fromTap) {
    camBtn.disabled = true; hintText.textContent = "Opening camera…";
    const ok = await tryLive();
    camBtn.disabled = false;
    if (ok) { status.textContent = ""; }
    else if (fromTap) {
      liveFailed = true; camBtn.hidden = true;
      hintText.textContent = "The live camera isn't available here. Tap Take photo to use your camera app, one photo per tap.";
    } else {
      hintText.textContent = "Turn on the camera to see yourself before the countdown.";
    }
    updateButtons();
    return ok;
  }
  camBtn.addEventListener("click", () => startCamera(true));
  startCamera(false);

  shootBtn.addEventListener("click", async () => {
    if (busy || shots.length >= 4) return;
    if (liveFailed) { file.click(); return; }
    if (!stream && !(await startCamera(true))) return;
    runSequence();
  });

  file.addEventListener("change", () => {
    const f = file.files?.[0]; file.value = "";
    if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => { addShot(capture(img, img.naturalWidth, img.naturalHeight, false)); URL.revokeObjectURL(url); };
    img.onerror = () => { status.textContent = "That file isn't an image this browser can read. Try a JPG or PNG."; URL.revokeObjectURL(url); };
    img.src = url;
  });

  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
    video.style.filter = cssFilter(filter);   // live preview shows the look right away
    drawStrip();
    if (!preview.hidden && shots.length) showPreview(shots[shots.length-1]);
  });

  caption.addEventListener("input", drawStrip);

  /* ---------- Normal / Wide angle ---------- */
  // The iPad front camera is ultra-wide. "Normal" crops in 1.5x (preview and photo alike);
  // "Wide angle" keeps the full frame. Change the data-z values in the HTML to adjust.
  const lensChips = document.querySelectorAll("#lens .chip");
  let zoom = 1.5;
  function setZoom(z) {
    zoom = z;
    $("finder").style.setProperty("--zoom", z);
    lensChips.forEach(c => c.setAttribute("aria-pressed", parseFloat(c.dataset.z) === z ? "true" : "false"));
  }
  $("lens").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b || busy) return;
    setZoom(parseFloat(b.dataset.z));
    if (stream && shots.length < 4) { video.hidden = false; preview.hidden = true; }  // back to live view to compare
  });
  setZoom(zoom);   // every visit starts on Normal

  retakeBtn.addEventListener("click", () => {
    cancelled = true;   // also stops a countdown in progress
    shots = []; status.textContent = "";
    preview.hidden = true;
    if (stream) video.hidden = false; else hint.hidden = false;
    drawStrip(); updateButtons();
  });

  /* ---------- saving ---------- */
  let downloads = null;
  (async () => { try { downloads = await window.claude?.use?.("downloads"); } catch {} })();
  saveBtn.addEventListener("click", () => {
    strip.toBlob(async blob => {
      if (!blob) return;
      if (downloads) {
        try { await downloads.save({ filename: "photobooth-strip.png", data: blob }); status.textContent = "Saved."; }
        catch (err) { status.textContent = err?.code === "declined" ? "Save cancelled." : "Saving isn't available here. Long-press the strip to save the image."; }
      } else {
        // outside the Claude viewer (e.g. the file opened locally): a normal download link works
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "photobooth-strip.png"; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
    }, "image/png");
  });

  document.fonts?.ready.then(drawStrip);
  drawStrip(); updateButtons();
})();
</script>

</body>
</html>
